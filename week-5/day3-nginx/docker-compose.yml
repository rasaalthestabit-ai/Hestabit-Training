services:

  backend1:
    build: ./server
    container_name: backend1
    ports:
      - "3001:3000"

  backend2:
    build: ./server
    container_name: backend2
    ports:
      - "3002:3000"

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend1
      - backend2
