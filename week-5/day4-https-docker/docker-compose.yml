services:

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs

    depends_on:
      - backend