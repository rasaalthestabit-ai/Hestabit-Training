services:

  backend:
    build: ./backend
    container_name: backend
    restart: always

    env_file:
      - .env

    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    volumes:
      - backend_logs:/app/logs

  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx

    depends_on:
      - backend

    restart: always

volumes:
  backend_logs:
  nginx_logs:
